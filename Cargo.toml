[package]
name = "kodegen_tools_terminal"
version = "0.3.4"
edition = "2024"
description = "KODEGEN.ᴀɪ: Memory-efficient, Blazing-Fast, MCP tools for code generation agents."
authors = ["KODEGEN.ᴀɪ"]
homepage = "https://kodegen.ai"
repository = "https://github.com/cyrup-ai/kodegen-tools-terminal"
readme = "README.md"
categories = ["development-tools", "command-line-utilities", "api-bindings"]
keywords = [
    "mcp",
    "terminal",
    "agent",
    "claude"
]
license = "Apache-2.0 OR MIT"

[package.metadata.bundle]
identifier = "ai.kodegen.kodegen_tools_terminal"
publisher = "KODEGEN.ᴀɪ"
copyright = "Copyright © 2025"
short_description = "Memory-efficient, Blazing-Fast, MCP tools for code generation agents."

[package.metadata.bundle.category]
linux = "Development"
macos = "public.app-category.developer-tools"


[dependencies]
kodegen_mcp_schema = { version = "0.3" }
kodegen_mcp_tool = { version = "0.3" }
kodegen_config_manager = { version = "0.3" }
kodegen_server_http = { version = "0.3" }
kgls = { version = "0.1" }

# MCP SDK - for Tool implementation
rmcp = { version = "0.9", features = ["client", "schemars", "server"] }

# Async runtime - for process management, IO, sync primitives
tokio = { version = "1", features = ["full"] }

# Serialization - for Args and responses
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Pattern matching - for command validation and REPL prompt detection
regex = "1"

# Small vector optimization - for command argument lists
smallvec = "1"

# Directory utilities - for home directory expansion in path validation
dirs = "5"

# Concurrent hashmap - for thread-safe rule storage in validation engine
dashmap = "6"

# Timestamps - for session tracking
chrono = { version = "0.4", features = ["serde"] }

# Logging - for debug/error/warn/info in managers
log = "0.4"
env_logger = "0.11"

# Error handling - for error conversion in terminal_manager
anyhow = "1"

# Core terminal emulation dependencies (Alacritty-based)
alacritty_terminal = "0.25"
vte = "0.15"                # MUST match alacritty_terminal's vte version exactly

# Brush shell - for in-process POSIX/bash shell execution
brush-core = "0.4"
brush-builtins = "0.1"
clap = { version = "4", features = ["derive"] }

# Prompt generator - for beautiful terminal prompts with git status
prmt = "0.1"

# PTY I/O
bytes = "1"
parking_lot = "0.12.5"
polling = "3.11"

# Platform-specific PTY support (Unix)
[target.'cfg(unix)'.dependencies]
rustix-openpty = "0.2.0"    # Modern PTY creation API
rustix = { version = "1.1.2", default-features = false, features = ["std"] }
signal-hook = "0.3.18"      # For SIGCHLD handling
libc = "0.2"

# Platform-specific PTY support (Windows)
[target.'cfg(windows)'.dependencies]
piper = "0.2.4"             # Async pipe wrapper
miow = "0.6.1"              # Windows I/O completion ports
windows-sys = { version = "0.61.2", features = [
    "Win32_System_Console",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
]}

[lib]
name = "kodegen_tools_terminal"
path = "src/lib.rs"

[[bin]]
name = "kodegen-terminal"
path = "src/main.rs"
