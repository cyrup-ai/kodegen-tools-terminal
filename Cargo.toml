[package]
name = "kodegen_tools_terminal"
version = "0.2.6"
edition = "2024"
description = "KODEGEN.ᴀɪ: Memory-efficient, Blazing-Fast, MCP tools for code generation agents."
authors = ["KODEGEN.ᴀɪ"]
homepage = "https://kodegen.ai"
repository = "https://github.com/cyrup-ai/kodegen-tools-terminal"
readme = "README.md"
categories = ["development-tools", "command-line-utilities", "api-bindings"]
keywords = [
    "mcp",
    "terminal",
    "agent",
    "claude"
]
license = "Apache-2.0 OR MIT"

[package.metadata.bundle]
identifier = "ai.kodegen.kodegen_tools_terminal"
publisher = "KODEGEN.ᴀɪ"
copyright = "Copyright © 2025"
short_description = "Memory-efficient, Blazing-Fast, MCP tools for code generation agents."

[package.metadata.bundle.category]
linux = "Development"
macos = "public.app-category.developer-tools"


[dependencies]
kodegen_mcp_schema = { version = "0.2", path = "../kodegen-mcp-schema" }
kodegen_mcp_tool = { version = "0.2", path = "../kodegen-mcp-tool" }
kodegen_config_manager = { version = "0.2", path = "../kodegen-config-manager" }
kodegen_utils = { version = "0.2", path = "../kodegen-utils" }
kodegen_server_http = { version = "0.2", path = "../kodegen-server-http" }

# MCP SDK - for Tool implementation
rmcp = { version = "0.9", features = ["client", "schemars", "server"] }

# Async runtime - for process management, IO, sync primitives
tokio = { version = "1", features = ["full"] }

# Serialization - for Args and responses
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Pattern matching - for command validation and REPL prompt detection
regex = "1"

# Timestamps - for session tracking
chrono = { version = "0.4", features = ["serde"] }

# Logging - for debug/error/warn/info in managers
log = "0.4"
env_logger = "0.11"

# Error handling - for error conversion in terminal_manager
anyhow = "1"

# TLS support - for embedded server mode
rustls = "0.23"

# Core terminal emulation dependencies (Alacritty-based)
alacritty_terminal = "0.25"
vte = "0.15"                # MUST match alacritty_terminal's vte version exactly
parking_lot = "0.12.5"      # More efficient RwLock than std::sync::RwLock
unicode-width = "0.2.2"     # For proper wide character handling
base64 = "0.22.1"           # For alacritty_terminal's image protocol support
bitflags = "2.10.0"          # For alacritty_terminal's cell flags
home = "0.5.12"              # For shell path resolution
regex-automata = "0.4.13"    # For alacritty_terminal's search features (optional)

# PTY I/O
bytes = "1"

[dev-dependencies]
kodegen_mcp_client = { version = "0.2", path = "../kodegen-mcp-client" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Platform-specific PTY support (Unix)
[target.'cfg(unix)'.dependencies]
rustix-openpty = "0.2.0"    # Modern PTY creation API
rustix = { version = "1.1.2", default-features = false, features = ["std"] }
signal-hook = "0.3.18"      # For SIGCHLD handling
libc = "0.2"

# Platform-specific PTY support (Windows)
[target.'cfg(windows)'.dependencies]
piper = "0.2.4"             # Async pipe wrapper
miow = "0.6.1"              # Windows I/O completion ports
windows-sys = { version = "0.61.2", features = [
    "Win32_System_Console",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
]}

[lib]
name = "kodegen_tools_terminal"
path = "src/lib.rs"

[[bin]]
name = "kodegen-terminal"
path = "src/main.rs"
